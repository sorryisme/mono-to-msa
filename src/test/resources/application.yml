spring:
  application:
    name: fmarket
  datasource:
    # @SpringBootTest(전체 컨텍스트)는 DataSourceConfiguration 이 바인딩하는 source/replica 를 쓰고,
    # @DataJpaTest 슬라이스는 TypeExcludeFilter 로 그 @Configuration 을 제외하므로
    # DataSourceAutoConfiguration 이 읽는 아래 플랫 프로퍼티가 별도로 필요하다.
    # 이게 없으면 슬라이스가 임베디드 H2 로 폴백해 MySQL DDL 파싱에 실패한다.
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fmarket}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:sorry}
    password: ${MYSQL_PASSWORD}
    # 로컬 단일 인스턴스라 source/replica 모두 같은 DB 를 가리킨다.
    source:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fmarket}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USER:sorry}
      password: ${MYSQL_PASSWORD}
      pool-name: fmarket-source
    replica:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fmarket}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USER:sorry}
      password: ${MYSQL_PASSWORD}
      pool-name: fmarket-replica
  jpa:
    # 스키마는 schema.sql 이 관리한다. Hibernate 가 운영 스키마를 건드리지 않게 none 으로 고정한다.
    hibernate:
      ddl-auto: none
    # 트랜잭션 밖(뷰 렌더링 시점)의 지연 로딩을 막는다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
