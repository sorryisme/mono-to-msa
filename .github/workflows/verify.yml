# 로컬 hook 은 --no-verify 로 우회할 수 있지만 CI 는 우회할 수 없다.
# 로컬과 동일한 스크립트(scripts/verify-full.sh)를 호출한다.
#
# DB 자격증명은 이 파일에 적지 않는다. 잡마다 임시 비밀번호를 새로 만들어 쓰고,
# 잡이 끝나면 컨테이너와 함께 사라진다. 따라서 GitHub Secrets 설정도 필요 없다.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치/PR 에 새 커밋이 올라오면 진행 중이던 검증은 이미 낡은 것이므로 취소한다.
# 단 main 에 대한 push 는 커밋마다 검증 결과가 남아야 하므로 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: fmarket
      MYSQL_USER: fmarket_ci
    steps:
      - uses: actions/checkout@v5

      # wait-for-it.sh는 timeout 내부에서 자신을 직접 실행하므로 먼저 실행 권한이 필요하다.
      - name: 스크립트 실행 권한 설정
        run: chmod +x gradlew scripts/*.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 임시 DB 자격증명 생성
        run: |
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::$PW"
          echo "MYSQL_PASSWORD=$PW" >> "$GITHUB_ENV"
          ROOT_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$ROOT_PW"
          echo "MYSQL_ROOT_PASSWORD=$ROOT_PW" >> "$GITHUB_ENV"

      - name: 테스트용 MySQL 기동
        run: |
          # 매퍼 SQL 이 "USER" 처럼 식별자를 쌍따옴표로 인용하므로 ANSI_QUOTES 가 없으면
          # 문자열 리터럴로 해석돼 전부 문법 오류가 난다. docker-compose 와 같은 설정을 쓴다.
          docker run -d --name ci-mysql \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            -p "${MYSQL_PORT}:3306" \
            mysql:8.4 \
            --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ANSI_QUOTES \
            --lower-case-table-names=1
          bash scripts/wait-for-it.sh "${MYSQL_HOST}:${MYSQL_PORT}" -t 90
          # 포트가 열려도 초기화가 끝나기 전일 수 있다
          for _ in $(seq 30); do
            docker exec ci-mysql mysqladmin ping -h 127.0.0.1 --silent && break
            sleep 2
          done

      - name: 전체 검증
        run: bash scripts/verify-full.sh

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: 정리
        if: always()
        run: docker rm -f ci-mysql || true
