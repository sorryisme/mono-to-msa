plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'jacoco'
}

group = 'com.sorryisme'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.data:spring-data-commons' //페이지네이션 용도
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 부터 @DataJpaTest 슬라이스는 별도 모듈로 분리되어 있다.
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    // @WebMvcTest 슬라이스도 Boot 4 부터 별도 모듈이다.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // JUnit 5·Mockito·AssertJ 는 spring-boot-starter-test 에 포함되어 있어 별도 선언하지 않는다.
}

// 자격증명은 .env 에만 둔다(.gitignore 대상). application.yml 은 기본값을 갖지 않으므로
// 값이 없으면 빈 비밀번호로 조용히 붙는 대신 기동 단계에서 바로 실패한다.
// 테스트/실행 JVM 은 .env 를 자동으로 읽지 않아 여기서 주입한다.
// CI 는 워크플로에서 환경변수를 직접 주입하므로 .env 없이 동작한다.
def dotenv = [:]
def dotenvFile = file('.env')
if (dotenvFile.exists()) {
    dotenvFile.eachLine('UTF-8') { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
            def idx = trimmed.indexOf('=')
            dotenv[trimmed.substring(0, idx).trim()] = trimmed.substring(idx + 1).trim()
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    dotenv.each { key, value -> environment(key, value) }
}

tasks.named('bootRun') {
    dotenv.each { key, value -> environment(key, value) }
}

jacoco {
    toolVersion = '0.8.13'
}

// 테스트를 돌리면 커버리지 리포트도 함께 만들어진다. 별도 태스크를 기억할 필요가 없다.
tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

// 로직이 없는 코드만 클래스 단위로 집계에서 뺀다.
// 패키지 단위(entity/dto/config)로 빼면 그 안에 있는 금액 계산·상태 전이·입력 경계 검사·
// 읽기/쓰기 DB 라우팅까지 함께 빠져, 게이트가 정작 지켜야 할 코드를 보지 못한다.
// Lombok 생성 메서드는 lombok.config 의 @Generated 표식으로, record·enum 의 컴파일러 생성 메서드는
// JaCoCo 필터로 자동 제외되므로 여기 적지 않는다.
// 새 클래스를 여기 추가할 때는 "분기·계산·예외가 전혀 없는가"를 기준으로 판단한다.
// 리포트와 검증이 같은 대상을 보도록 한 곳에 두고 양쪽에서 쓴다.
def jacocoExcludes = [
        // 실행 진입점
        '**/FmarketApplication.class',
        // 애노테이션 선언과 상수 홀더
        '**/annotation/**',
        '**/common/AppConstants.class',
        // 프로퍼티를 바인딩해 빈을 조립하기만 한다. 실제 연결은 @SpringBootTest 스모크 테스트가 본다.
        '**/config/DataSourceConfiguration.class',
        '**/config/WebConfig.class',
]

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        // HTML 은 사람이 읽는 용도, XML 은 나중에 커버리지 수집 도구를 붙일 때 쓴다.
        html.required = true
        xml.required = true
        csv.required = false
    }

    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: jacocoExcludes)
            })
    )
}

// 하한은 측정된 수치(LINE 97.1% / BRANCH 96.1%, 2026-09-14 제외 범위 축소 후)보다 낮게 잡는다.
// 사소한 리팩터링마다 빌드가 깨지면 개발자가 게이트를 우회하게 되고, 그러면 게이트가 있으나 마나 해진다.
// 여기서 잡으려는 것은 커버리지가 큰 폭으로 조용히 내려가는 상황이다.
// 분기는 전체 100개 남짓이라 1개가 약 1%p 다. BRANCH 92% 는 지금보다 분기 4개 정도를 더 놓칠 여유다.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.92
            }
        }
    }

    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: jacocoExcludes)
            })
    )
}

// check 에 걸어 로컬 pre-push 와 CI 양쪽에서 강제한다(scripts/verify-full.sh 는
// ./gradlew clean check 를 호출한다).
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
